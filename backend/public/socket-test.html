<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>ShahrakYar Socket Console</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        body{
            font-family:Arial;
            margin:40px;
            background:#f4f4f4;
        }

        h2{
            color:#1e88e5;
        }

        #events{

            background:white;

            border-radius:8px;

            padding:20px;

            box-shadow:0 0 10px rgba(0,0,0,.15);

            min-height:300px;

        }

        .event{

            padding:10px;

            margin-bottom:10px;

            border-left:5px solid #1e88e5;

            background:#fafafa;

        }

    </style>

</head>

<body>

<h2>ShahrakYar Live Events</h2>

<div id="events"></div>

<script>

const socket = io();

const events =
    document.getElementById("events");

function addEvent(title,data){

    const div =
        document.createElement("div");

    div.className="event";

    div.innerHTML=
        `<strong>${title}</strong><br>
        <pre>${JSON.stringify(data,null,2)}</pre>`;

    events.prepend(div);

}

socket.on("connect",()=>{

    addEvent("Connected",{

        socketId:socket.id

    });

});

socket.on("residentCreated",(resident)=>{

    addEvent("Resident Created",resident);

});

socket.on("residentUpdated",(resident)=>{

    addEvent("Resident Updated",resident);

});

socket.on("residentDeleted",(resident)=>{

    addEvent("Resident Deleted",resident);

});

</script>

</body>

</html>
