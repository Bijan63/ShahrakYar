name: ShahrakYar CI

on:
    push:
        branches:
            - develop
            - main

    pull_request:
        branches:
            - develop
            - main

jobs:
    backend:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16

                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: ci_only_password_for_github_actions
                    POSTGRES_DB: shahrakyar

                ports:
                    - 5432:5432

                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            DATABASE_URL: postgresql://postgres:ci_only_password_for_github_actions@localhost:5432/shahrakyar

            JWT_SECRET: test-secret

            JWT_EXPIRE: 7d

            NODE_ENV: test

            PORT: 5000

            BCRYPT_SALT_ROUNDS: 10

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npx prisma generate

            - name: Run Prisma Migrations
              run: npx prisma migrate deploy

            - name: Build Docker Image
              run: docker build -t shahrakyar-api .

            - name: Verify Build
              run: echo "✅ CI Build Passed"
